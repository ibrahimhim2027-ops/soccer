<style>
:root{
  --bg:#ffffff; --text:#0d1b33; --muted:#56637a;
  --line:#dfe5ee; --accent:#c1121f;
  --head:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--body); font-size:17px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; padding:32px 22px;
}
.wrap{width:100%; max-width:900px}
.eyebrow{
  display:flex; align-items:center; gap:10px;
  font-size:.74rem; font-weight:700; letter-spacing:.18em;
  text-transform:uppercase; color:var(--accent); margin:0 0 10px;
}
.eyebrow::before{content:''; width:26px; height:2px; background:var(--accent)}
h1{
  font-family:var(--head); font-weight:800; text-transform:uppercase;
  font-size:clamp(1.7rem,4.4vw,2.8rem); line-height:1.02; letter-spacing:.02em;
  margin:0 0 20px;
}
/* YouTube hands you a fixed 560x315, which overflows a phone.
   This wrapper keeps a 16:9 shape at any width instead.      */
.frame{
  position:relative; aspect-ratio:16/9; width:100%;
  background:#0d1b33; border:1px solid var(--line); border-radius:14px;
  overflow:hidden;
  box-shadow:0 2px 4px rgba(16,24,40,.06), 0 18px 44px rgba(16,24,40,.12);
}
.frame iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
p.note{margin:16px 0 0; color:var(--muted); font-size:.92rem}
p.note a{color:var(--accent)}
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Film</p>
    <h1>Attacking Runs and Movement Off the Ball</h1>

    <div class="frame">
      <iframe
        src="https://www.youtube.com/embed/pplK_cufi20?si=0Mu29x9sycpYbSdV"
        title="Attacking Runs and Movement Off the Ball"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"

  </div>
